name: Bug report (English)
description: Report a reproducible problem with the app
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include passcodes, complete access tokens, private file contents, or other sensitive data.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - Windows x64
        - Visitor browser UI
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: For example, 0.2.1
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      placeholder: Describe the actual result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a share...
        2. Open the visitor link...
        3. Click...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add redacted screenshots, browser details, or error logs if helpful.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirm that this report contains no passcodes, complete tokens, or private file contents.
          required: true
