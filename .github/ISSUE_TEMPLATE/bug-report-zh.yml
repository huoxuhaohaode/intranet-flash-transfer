name: Bug 反馈（中文）
description: 报告可以稳定复现的程序问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿粘贴访问口令、完整访问令牌、私有文件内容或其他敏感信息。
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - macOS Apple Silicon
        - Windows x64
        - 访客浏览器页面
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 程序版本
      placeholder: 例如 0.2.1
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      placeholder: 发生了什么？实际结果与预期结果分别是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 创建共享……
        2. 打开访客链接……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可添加已脱敏截图、浏览器版本或错误日志。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容中不包含访问口令、完整令牌或私有文件内容。
          required: true
