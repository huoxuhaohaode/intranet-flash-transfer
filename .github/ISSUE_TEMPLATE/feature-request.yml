name: 功能建议 / Feature request
description: 建议新的功能或体验改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / Use case
      description: 你想解决什么问题？What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed solution
      description: 描述理想的操作方式或结果。Describe the preferred workflow or outcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / Alternatives
      description: 是否尝试过其他解决办法？Have you tried another approach?
