name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            artifact-name: macos-dmg
            build: npm run tauri:build:mac:raw
          - name: Windows
            os: windows-latest
            artifact-name: windows-exe
            build: npm run tauri:build:win

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: TypeScript lint
        run: npm run lint

      - name: Rust smoke tests
        run: cargo test
        working-directory: src-tauri

      - name: Bundle app
        run: ${{ matrix.build }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
