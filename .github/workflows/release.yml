name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            suffix: darwin-aarch64
            command: npx tauri build --bundles app,dmg
            artifact: macos-dmg
            path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
              src-tauri/target/release/bundle/updater/**
          - name: Windows
            os: windows-latest
            suffix: windows-x86_64
            command: npm run tauri:build:win
            artifact: windows-exe
            path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
              src-tauri/target/release/bundle/updater/**

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Configure updater signing
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$UPDATER_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY=$UPDATER_PRIVATE_KEY" >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$UPDATER_PRIVATE_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Configure Rust path remapping
        shell: bash
        run: |
          CARGO_HOME_DIR="${CARGO_HOME:-$HOME/.cargo}"
          echo "RUSTFLAGS=--remap-path-prefix $GITHUB_WORKSPACE=/build/app --remap-path-prefix $CARGO_HOME_DIR/registry=/build/cargo" >> "$GITHUB_ENV"

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Normalize artifact filenames
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cd src-tauri/target/release/bundle
          if [ "${{ matrix.name }}" = "macOS" ]; then
            mv "macos/内网闪传.app.tar.gz" "macos/lan-transfer-$VERSION-aarch64.app.tar.gz"
            mv "macos/内网闪传.app.tar.gz.sig" "macos/lan-transfer-$VERSION-aarch64.app.tar.gz.sig"
            mv "dmg/内网闪传_${VERSION}_aarch64.dmg" "dmg/lan-transfer-$VERSION-aarch64.dmg"
          else
            mv "nsis/内网闪传_${VERSION}_x64-setup.exe" "nsis/lan-transfer-$VERSION-x64-setup.exe"
            mv "nsis/内网闪传_${VERSION}_x64-setup.exe.sig" "nsis/lan-transfer-$VERSION-x64-setup.exe.sig"
          fi

      - name: Generate updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "macOS" ]; then
            ASSET=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name 'lan-transfer-*.app.tar.gz' | head -n 1)
          else
            ASSET=$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name 'lan-transfer-*-setup.exe' | head -n 1)
          fi
          SIG="$ASSET.sig"
          node scripts/generate-updater-manifest.cjs \
            --target "${{ matrix.suffix }}" \
            --asset-path "$ASSET" \
            --signature-file "$SIG" \
            --repository "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --output "src-tauri/target/release/bundle/updater/latest-${{ matrix.suffix }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**
